<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in · Launchpad</title><link rel="icon" href="/assets/launchpad-logo.png"><link rel="stylesheet" href="/assets/catalog.css"><script type="module" src="/assets/admin-login.js"></script></head>
<body class="admin-login-page"><main class="admin-login-card"><a class="catalog-brand" href="/"><img class="brand-logo" src="/assets/launchpad-logo.png" alt="Launchpad"><span>ADMIN</span></a><div class="admin-emblem" aria-hidden="true">◇</div><p class="eyebrow">YOUR CONTROL CENTER</p><h1>Welcome back,<br>administrator.</h1><p class="muted">Sign in to manage products and announcements.</p><div id="message" class="message" role="status" aria-live="polite" hidden></div><form id="admin-login-form"><label for="email">Admin email</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254" placeholder="Enter your admin email"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button class="button primary" id="sign-in" type="submit">Sign in to admin <span aria-hidden="true">→</span></button></form><a class="back-home" href="/">← Back to user sign in</a><p class="subtle">Administrator access only</p></main></body></html>
