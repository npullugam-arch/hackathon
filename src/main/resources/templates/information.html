<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${page.title + ' | ' + siteInfo.companyName}">Information</title><link rel="icon" href="/assets/launchpad-logo.png"><link rel="stylesheet" href="/assets/catalog.css"><link rel="stylesheet" href="/assets/user-shell.css"><link rel="stylesheet" href="/assets/site-footer.css"></head><body><header class="user-header"><a class="user-brand" href="/dashboard"><img class="launchpad-logo" src="/assets/launchpad-logo.png" alt="Launchpad"></a><a class="button secondary" href="/dashboard">Back to Home</a></header><main class="catalog-main information-main"><a class="back-home" href="/information/about">Company &amp; information</a><div class="information-heading"><p class="eyebrow">CLARITY AT EVERY STEP</p><h1 th:text="${page.title}"></h1><p th:text="${page.intro}"></p></div><article class="information-card"><section th:each="section : ${page.sections}"><h2 th:text="${section.heading}"></h2><p th:text="${section.body}"></p></section><div class="information-help"><h2>Need more information?</h2><p>Sign in to submit or follow a support request.</p><a class="button primary" href="/features/customer-service">Customer Support</a><p th:if="${contactPage and !siteInfo.supportEmail.isEmpty()}"><a th:href="${'mailto:' + siteInfo.supportEmail}" th:text="${siteInfo.supportEmail}"></a></p></div></article></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
