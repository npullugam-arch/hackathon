<section th:fragment="invitations" id="invitations-section" hidden>
<div class="section-heading"><div><h2>Invitations / Referrals</h2><p class="muted">Permanent relationships and verified reward ledger entries.</p></div><button id="ai-refresh" class="button secondary" type="button">Refresh</button></div>
<p id="ai-error" class="message" role="alert" hidden></p>
<form id="ai-filters" class="commerce-filters">
<div><label for="ai-inviter">Inviter</label><input id="ai-inviter" name="inviter" maxlength="128"></div><div><label for="ai-invitee">Invited user</label><input id="ai-invitee" name="invitee" maxlength="128"></div><div><label for="ai-code">Referral code</label><input id="ai-code" name="code" maxlength="32"></div>
<div><label for="ai-from">From</label><input id="ai-from" name="from" type="date"></div><div><label for="ai-to">To</label><input id="ai-to" name="to" type="date"></div>
<div><label for="ai-purchase">Purchase status</label><select id="ai-purchase" name="purchaseStatus"><option value="">All</option><option>PENDING</option><option>PAID</option></select></div><div><label for="ai-reward">Reward status</label><select id="ai-reward" name="rewardStatus"><option value="">All</option><option>PENDING</option><option>COMPLETED</option><option>CLAIMED</option><option>LOCKED</option></select></div><div><label for="ai-sort">Sort</label><select id="ai-sort" name="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div><button class="button secondary" type="submit">Apply filters</button></form>
<p id="ai-empty" role="status">Loading invitations...</p><div class="commerce-scroll"><table class="admin-invitations-table"><thead><tr><th>Inviter Name</th><th>Invited User Name</th><th>Referral Code</th><th>Registration Date</th><th>Product Purchased</th><th>Purchase Amount</th><th>Purchase Status</th><th>Inviter Reward</th><th>Invitee Reward</th><th>Reward Status</th></tr></thead><tbody id="ai-rows"></tbody></table></div>
<div class="commerce-pagination"><button id="ai-previous" class="button secondary" type="button" disabled>Previous</button><span id="ai-page"></span><button id="ai-next" class="button secondary" type="button" disabled>Next</button></div></section>
